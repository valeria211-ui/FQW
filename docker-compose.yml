version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: benchmark_postgres
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"            
    volumes:
      - pgdata:/var/lib/postgresql   

  redis:
    image: redis:7
    container_name: benchmark_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
